# Continuous integration — fast hermetic tests (no API keys, no live/net).
# Branch protection / required checks are configured in GitHub repo settings.
#
# PRs get a comment + check run from publish-unit-test-result-action (pass/fail,
# counts, and comparison vs base when applicable).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=test-results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: pytest
          comment_mode: always
          job_summary: true
          # Highlights added/removed tests vs earlier commits on PRs (default on)
          compare_to_earlier_commit: true
