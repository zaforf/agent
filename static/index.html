<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>

  <!-- Marked (markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <!-- KaTeX (LaTeX math) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg:          #f7f6f3;
      --surface:     #ffffff;
      --panel:       #f2f1ee;
      --border:      #e3e2de;
      --border-2:    #ccc9c4;
      --text:        #1a1917;
      --text-2:      #6b6966;
      --text-3:      #a8a5a1;
      --user-bg:     #1a1917;
      --user-text:   #faf9f6;
      --accent:      #2563eb;
      --call-accent:   #507a64;
      --result-accent: #4a4f4d;
      --danger:      #dc2626;
      --radius:      8px;
      --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono:        'Menlo', 'Consolas', 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Side panels (fixed overlay drawers) ────────────── */

    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      z-index: 50;
      transition: transform 0.2s ease;
    }
    #panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 45;
      display: none;
    }
    #panel-backdrop.open { display: block; }
    #sessions-panel {
      left: 0;
      transform: translateX(-100%);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0,0,0,0.07);
    }
    #mem-panel {
      right: 0;
      transform: translateX(100%);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0,0,0,0.07);
    }
    #sessions-panel.open,
    #mem-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-header-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Sessions */
    .sess-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent; /* reserve space — prevents layout shift on active */
    }
    .sess-item:hover  { background: var(--panel); }
    .sess-item.active { background: var(--surface); border-color: var(--border); }
    .sess-preview {
      font-size: 12.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sess-meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }
    .sess-row { display: flex; align-items: flex-start; gap: 4px; }
    .sess-del {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
      opacity: 0;
      flex-shrink: 0;
    }
    .sess-item:hover .sess-del { opacity: 1; }
    .sess-del:hover { color: var(--danger); }

    /* Memories */
    .mem-entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .mem-body  { flex: 1; min-width: 0; }
    .mem-text  { font-size: 12.5px; color: var(--text); line-height: 1.45; }
    .mem-cat   { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }
    .mem-del   { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 15px; line-height: 1; flex-shrink: 0; }
    .mem-del:hover { color: var(--danger); }

    /* ── Chat column ─────────────────────────────────────── */

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
    }

    /* Constrain content width, centered */
    .msg-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message rows */
    .row { display: flex; }
    .row.user  { justify-content: flex-end; }
    .row.agent { justify-content: flex-start; }
    .row.step                    { justify-content: flex-start; margin-top: -10px; }
    .row:not(.step) + .row.step  { margin-top: 1px; }

    /* Bubbles */
    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      word-break: break-word;
      line-height: 1.6;
    }

    .user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      max-width: 75%;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .agent .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      max-width: 88%;
      font-size: 14px;
    }

    /* Tool steps — shared */
    .step .bubble {
      font-family: var(--font);
      font-size: 11.5px;
      padding: 5px 10px;
      max-width: 88%;
      cursor: pointer;
      user-select: none;
    }
    /* Tool call / result */
    .tool-call .bubble,
    .tool-result .bubble {
      background: #f8f5f2;
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Direction chip — colored square with simple keyboard symbol */
    .step-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
      font-family: var(--mono);
      line-height: 1;
    }
    .tool-call .step-tag   { background: var(--call-accent); }
    .tool-result .step-tag { background: var(--result-accent); }

    /* Step header row */
    .step-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .step-meta {
      font-weight: normal;
      opacity: 0.5;
      font-size: 10px;
    }
    /* Step body (collapsed by default) */
    .step-body {
      display: none;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      cursor: text;
      max-height: 140px;
      overflow-y: auto;
    }
    .bubble.expanded .step-body { display: block; }

    /* Fallback tag */
    .fallback-tag {
      font-size: 10.5px;
      color: var(--text-3);
      margin-bottom: 6px;
      font-style: italic;
    }

    /* ── Markdown content ────────────────────────────────── */

    .md-content p          { margin: 0.55em 0; }
    .md-content p:first-child { margin-top: 0; }
    .md-content p:last-child  { margin-bottom: 0; }
    .md-content h1,.md-content h2,.md-content h3,
    .md-content h4,.md-content h5,.md-content h6 {
      margin: 1em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .md-content h1 { font-size: 1.3em; }
    .md-content h2 { font-size: 1.15em; }
    .md-content h3 { font-size: 1.05em; }
    .md-content ul,.md-content ol { padding-left: 1.4em; margin: 0.45em 0; }
    .md-content li { margin: 0.2em 0; }
    .md-content blockquote {
      border-left: 3px solid var(--border-2);
      margin: 0.6em 0;
      padding: 0.3em 0.8em;
      color: var(--text-2);
    }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 13px; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .md-content th { background: var(--panel); font-weight: 600; }
    .md-content code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.35em;
    }
    .md-content pre {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0.65em 0;
    }
    .md-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.55;
    }
    .md-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md-content strong { font-weight: 600; }

    /* User bubble: keep plain text */
    .user .bubble code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      padding: 0.1em 0.3em;
    }

    /* ── Bottom bar ──────────────────────────────────────── */

    #bar-wrap {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 16px;
      position: relative;
    }
    #bar {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      resize: none;
      height: 36px;
      max-height: 120px;
      line-height: 1.45;
      overflow-y: hidden;
      transition: border-color 0.1s;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--text-3); }

    #thinking-ind {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 16px;
      right: 16px;
      max-width: 720px;
      margin: 0 auto;
      padding: 5px 0;
      font-size: 13px;
      color: var(--text-3);
    }
    #thinking-ind.active { display: block; }

    /* Buttons — all same height (36px) */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      white-space: nowrap;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
    }
    .btn-send {
      background: var(--user-bg);
      color: var(--user-text);
    }
    .btn-send:hover:not(:disabled) { background: #2d2d2c; }
    .btn-send:disabled { opacity: 0.35; cursor: default; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 0 10px;
      font-size: 15px;
    }
    .btn-icon:hover { background: var(--panel); color: var(--text); }
    .btn-icon.active { background: var(--panel); border-color: var(--border-2); color: var(--text); }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11px;
      height: 26px;
      padding: 0 8px;
    }
    .btn-sm:hover { background: var(--border); color: var(--text); }

    /* ── System prompt modal ─────────────────────────────── */

    #sp-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #sp-overlay.open { display: flex; }
    #sp-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 640px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    #sp-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
    }
    #sp-textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.6;
      resize: none;
      outline: none;
      min-height: 280px;
      overflow-y: auto;
    }
    #sp-box-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    #sp-box-footer .btn { height: 32px; }

    /* ── Misc ────────────────────────────────────────────── */

    .empty-hint {
      color: var(--text-3);
      font-size: 12.5px;
      text-align: center;
      padding: 20px 10px;
    }

    /* Scrollbar (webkit) */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

    @media (max-width: 760px) {
      .side-panel {
        width: 100vw;
        max-width: 100vw;
        z-index: 60;
      }
      .panel-header { padding: 10px 12px; }
      #messages { padding: 14px 10px; }
      .msg-inner { gap: 12px; }
      #bar-wrap { padding: 8px 10px; }
      #bar { gap: 6px; }
      .btn { padding: 0 10px; }
      .btn-icon { padding: 0 8px; }
      .agent .bubble { max-width: 94%; }
      .user .bubble { max-width: 86%; }
    }
  </style>
</head>
<body>

<div id="panel-backdrop" onclick="closePanels()"></div>

<!-- Sessions panel -->
<div id="sessions-panel" class="side-panel">
  <div class="panel-header">
    <span class="panel-header-title">Sessions</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" onclick="newSession()">+ New</button>
      <button class="btn btn-sm" onclick="closePanels()">✕</button>
    </div>
  </div>
  <div id="sess-list" class="panel-body"></div>
</div>

<!-- Chat -->
<div id="chat">
  <div id="messages">
    <div class="msg-inner" id="msg-inner"></div>
  </div>
  <div id="bar-wrap">
    <div id="thinking-ind"><span id="thinking-lbl"></span><span id="thinking-dots-txt"></span></div>
    <div id="bar">
      <button class="btn btn-icon" id="btn-sessions" onclick="togglePanel('sessions-panel','btn-sessions')" title="Sessions">☰</button>
      <textarea id="input" placeholder="Message…" rows="1"></textarea>
      <button class="btn btn-send" id="send-btn" onclick="send()">Send</button>
      <button class="btn btn-icon" id="btn-mem" onclick="togglePanel('mem-panel','btn-mem')" title="Memories">◈</button>
      <button class="btn btn-icon" onclick="openSP()" title="System prompt">⚙</button>
    </div>
  </div>
</div>

<!-- Memories panel -->
<div id="mem-panel" class="side-panel">
  <div class="panel-header">
    <span class="panel-header-title">Memories</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" onclick="loadMemories()">↺ Refresh</button>
      <button class="btn btn-sm" onclick="closePanels()">✕</button>
    </div>
  </div>
  <div id="mem-list" class="panel-body"></div>
</div>

<!-- System prompt modal -->
<div id="sp-overlay" onclick="closeSP(event)">
  <div id="sp-box" onclick="event.stopPropagation()">
    <div id="sp-box-header">
      <span>System Prompt</span>
      <button class="btn btn-sm" onclick="closeSP()">✕</button>
    </div>
    <textarea id="sp-textarea" spellcheck="false"></textarea>
    <div id="sp-box-footer">
      <button class="btn btn-sm" onclick="closeSP()">Cancel</button>
      <button class="btn btn-send" onclick="saveSP()">Save</button>
    </div>
  </div>
</div>

<script>
  // ── Markdown / Math setup ─────────────────────────────────

  marked.setOptions({ breaks: true, gfm: true });

  function renderMarkdown(text) {
    return marked.parse(text);
  }

  /**
   * Like renderMarkdown but tolerates incomplete code blocks that occur
   * mid-stream. Closes any unclosed ``` fence or lone ` backtick so the
   * browser DOM stays well-formed while chunks are still arriving.
   */
  function renderStreamingMarkdown(text) {
    // Close unclosed triple-backtick fences
    const fences = (text.match(/^```/gm) || []).length;
    if (fences % 2 !== 0) text += '\n```';
    // Remove completed fences, then count remaining lone backticks
    const noFences = text
      .replace(/```[\s\S]*?```/g, '')
      .replace(/```[\s\S]*$/, '');
    const singles = (noFences.match(/`/g) || []).length;
    if (singles % 2 !== 0) text += '`';
    return marked.parse(text);
  }

  function renderMath(el) {
    if (typeof renderMathInElement === 'undefined') return;
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true  },
        { left: '$',  right: '$',  display: false },
        { left: '\\[', right: '\\]', display: true  },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
    });
  }

  // ── State ─────────────────────────────────────────────────

  const feed    = document.getElementById('msg-inner');
  const messagesEl = document.getElementById('messages');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  let stickToBottom = true;
  let mathRenderTimer = null;

  let sid = localStorage.getItem('sid') || newSid();
  localStorage.setItem('sid', sid);

  function newSid() { return Math.random().toString(36).slice(2); }

  // ── Utils ─────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const now = new Date();
    if (d.toDateString() === now.toDateString())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function closePanels() {
    document.getElementById('sessions-panel').classList.remove('open');
    document.getElementById('mem-panel').classList.remove('open');
    document.getElementById('btn-sessions').classList.remove('active');
    document.getElementById('btn-mem').classList.remove('active');
    document.getElementById('panel-backdrop').classList.remove('open');
  }

  function togglePanel(id, btnId) {
    const panel = document.getElementById(id);
    const opening = !panel.classList.contains('open');
    closePanels();
    if (!opening) return;
    panel.classList.add('open');
    if (btnId) document.getElementById(btnId).classList.add('active');
    document.getElementById('panel-backdrop').classList.add('open');
    if (id === 'sessions-panel') loadSessions();
    if (id === 'mem-panel')      loadMemories();
  }

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  }

  function scheduleMathRender(el) {
    if (!el || mathRenderTimer) return;
    mathRenderTimer = setTimeout(() => {
      renderMath(el);
      mathRenderTimer = null;
    }, 80);
  }

  messagesEl.addEventListener('scroll', () => {
    stickToBottom = isNearBottom(messagesEl);
  });

  function scrollToLastAssistant() {
    const assistants = feed.querySelectorAll('.row.agent');
    if (!assistants.length) {
      scrollFeed(true);
      return;
    }
    const last = assistants[assistants.length - 1];
    const target = Math.max(0, last.offsetTop - (messagesEl.clientHeight - last.offsetHeight - 16));
    messagesEl.scrollTop = target;
    stickToBottom = isNearBottom(messagesEl);
  }

  // ── Message rendering ─────────────────────────────────────

  function addUserMsg(text, shouldScroll = true) {
    const row = document.createElement('div');
    row.className = 'row user';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
  }

  /** Create an agent bubble and return its md-content div for streaming into. */
  function createAgentBubble(fallbackProvider, shouldScroll = true) {
    const row = document.createElement('div');
    row.className = 'row agent';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if (fallbackProvider) {
      const tag = document.createElement('div');
      tag.className = 'fallback-tag';
      tag.textContent = `via ${fallbackProvider}`;
      bub.appendChild(tag);
    }
    const md = document.createElement('div');
    md.className = 'md-content';
    bub.appendChild(md);
    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
    return md;
  }

  /** Render a complete agent message (used when loading history). */
  function addAgentMsg(text, shouldScroll = true) {
    const md = createAgentBubble(null, shouldScroll);
    md.innerHTML = renderMarkdown(text);
    setTimeout(() => renderMath(md), 0);
  }

  /** Add a collapsible tool step row. */
  function addStep(type, name, payload, shouldScroll = true) {
    const row = document.createElement('div');
    row.className = `row step ${type}`;

    const bub = document.createElement('div');
    bub.className = 'bubble';

    const sym = type === 'tool-call' ? '>' : '<';

    const header = document.createElement('div');
    header.className = 'step-header';

    // Meta hint shown in the collapsed header
    let meta = '';
    if (type === 'tool-call' && typeof payload === 'object') {
      const first = Object.values(payload)[0];
      if (first != null) {
        const s = String(first);
        meta = s.length > 50 ? s.slice(0, 50) + '…' : s;
      }
    } else if (type === 'tool-result') {
      const raw = String(payload ?? '');
      meta = raw.length > 80 ? raw.length.toLocaleString() + ' chars' : '';
    }

    header.innerHTML =
      `<span class="step-tag">${sym}</span>` +
      `<strong>${esc(name)}</strong>` +
      (meta ? `<span class="step-meta">${esc(meta)}</span>` : '');
    bub.appendChild(header);

    const body = document.createElement('div');
    body.className = 'step-body';
    if (type === 'tool-call' && typeof payload === 'object') {
      body.textContent = Object.entries(payload)
        .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
        .join('\n');
    } else {
      // Collapse whitespace/newlines into single spaces, then truncate
      let text = String(payload ?? '')
        .replace(/\s*\n\s*/g, ' ')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
      const MAX = 600;
      if (text.length > MAX) text = text.slice(0, MAX) + ' …';
      body.textContent = text;
    }
    bub.appendChild(body);

    bub.addEventListener('click', () => bub.classList.toggle('expanded'));

    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
    return row;
  }

  function scrollFeed(force = false) {
    if (!force && !stickToBottom && !isNearBottom(messagesEl)) return;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    stickToBottom = true;
  }

  // ── History ───────────────────────────────────────────────

  async function loadHistory() {
    feed.innerHTML = '';
    const res  = await fetch(`/sessions/${sid}/history`);
    const data = await res.json();
    for (const msg of data.messages) {
      if (msg.role === 'user') {
        addUserMsg(msg.content, false);
      } else {
        // Render stored tool steps before the assistant message
        for (const step of (msg.steps || [])) {
          if (step.type === 'tool_call')
            addStep('tool-call', step.name, step.args, false);
          else if (step.type === 'tool_result')
            addStep('tool-result', step.name, step.result, false);
        }
        addAgentMsg(msg.content, false);
      }
    }
    if (!data.messages.length) {
      feed.innerHTML = '<div class="empty-hint">New session — say something.</div>';
    }
    scrollToLastAssistant();
    highlightSession();
  }

  // ── Sessions ──────────────────────────────────────────────

  async function loadSessions() {
    const list = document.getElementById('sess-list');
    list.innerHTML = '';
    const res  = await fetch('/sessions');
    const data = await res.json();
    if (!data.sessions.length) {
      list.innerHTML = '<div class="empty-hint">No sessions yet.</div>';
      return;
    }
    for (const s of data.sessions) {
      const el = document.createElement('div');
      el.className = 'sess-item' + (s.session_id === sid ? ' active' : '');
      el.dataset.sid = s.session_id;
      el.innerHTML = `
        <div class="sess-row">
          <div style="flex:1;min-width:0">
            <div class="sess-preview">${esc(s.preview || '(empty)')}</div>
            <div class="sess-meta"><span>${s.count} msgs</span><span>${fmtDate(s.last_ts)}</span></div>
          </div>
          <button class="sess-del" title="Delete" onclick="deleteSession('${s.session_id}',event)">×</button>
        </div>`;
      el.addEventListener('click', () => switchSession(s.session_id));
      list.appendChild(el);
    }
  }

  function highlightSession() {
    document.querySelectorAll('.sess-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sid === sid);
    });
  }

  function switchSession(newSid) {
    sid = newSid;
    localStorage.setItem('sid', sid);
    loadHistory();
    highlightSession();
  }

  async function newSession() {
    sid = newSid();
    localStorage.setItem('sid', sid);
    await loadHistory();
    if (document.getElementById('sessions-panel').classList.contains('open')) loadSessions();
  }

  async function deleteSession(id, e) {
    e.stopPropagation();
    if (!confirm('Delete this session?')) return;
    await fetch(`/sessions/${id}`, { method: 'DELETE' });
    if (id === sid) newSession();
    else loadSessions();
  }

  // ── Memories ──────────────────────────────────────────────

  async function loadMemories() {
    const list = document.getElementById('mem-list');
    list.innerHTML = '<div class="empty-hint">Loading…</div>';
    const res  = await fetch('/memories');
    const data = await res.json();
    list.innerHTML = '';
    if (!data.memories.length) {
      list.innerHTML = '<div class="empty-hint">No memories yet.</div>';
      return;
    }
    for (const m of data.memories) {
      const el = document.createElement('div');
      el.className = 'mem-entry';
      el.innerHTML = `
        <div class="mem-body">
          <div class="mem-text">${esc(m.memory)}</div>
          <div class="mem-cat">${esc(m.metadata?.category ?? '')}</div>
        </div>
        <button class="mem-del" onclick="deleteMem('${m.id}',this)">×</button>`;
      list.appendChild(el);
    }
  }

  async function deleteMem(id, btn) {
    btn.disabled = true;
    await fetch(`/memories/${id}`, { method: 'DELETE' });
    btn.closest('.mem-entry').remove();
    if (!document.getElementById('mem-list').querySelector('.mem-entry'))
      document.getElementById('mem-list').innerHTML = '<div class="empty-hint">No memories yet.</div>';
  }

  // ── System prompt ─────────────────────────────────────────

  async function openSP() {
    const res  = await fetch('/system-prompt');
    const data = await res.json();
    document.getElementById('sp-textarea').value = data.content;
    document.getElementById('sp-overlay').classList.add('open');
    document.getElementById('sp-textarea').focus();
  }

  async function saveSP() {
    const content = document.getElementById('sp-textarea').value;
    await fetch('/system-prompt', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    closeSP();
  }

  function closeSP(e) {
    if (e && e.target !== document.getElementById('sp-overlay')) return;
    document.getElementById('sp-overlay').classList.remove('open');
  }

  // ── Thinking indicator ────────────────────────────────────

  const thinkEl   = document.getElementById('thinking-ind');
  const thinkLbl  = document.getElementById('thinking-lbl');
  const thinkDots = document.getElementById('thinking-dots-txt');
  const _DOT_FRAMES = ['.', '..', '...', '..', '.'];
  let _dotIdx = 0, _dotTimer = null;

  function _showThinking(label) {
    thinkLbl.textContent = label || '';
    thinkEl.className = 'active';
    if (!_dotTimer) {
      _dotIdx = 0;
      thinkDots.textContent = _DOT_FRAMES[0];
      _dotTimer = setInterval(() => {
        _dotIdx = (_dotIdx + 1) % _DOT_FRAMES.length;
        thinkDots.textContent = _DOT_FRAMES[_dotIdx];
      }, 320);
    }
  }

  function _hideThinking() {
    thinkEl.className = '';
    clearInterval(_dotTimer);
    _dotTimer = null;
    thinkLbl.textContent = '';
    thinkDots.textContent = '';
  }

  // ── Send (streaming) ──────────────────────────────────────

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    resetInputHeight();
    sendBtn.disabled = true;
    _showThinking('');

    const hint = feed.querySelector('.empty-hint');
    if (hint) hint.remove();

    addUserMsg(text);
    stickToBottom = true;

    let agentMd       = null;   // md-content div for the current text segment
    let textBuffer    = '';     // full response text (all segments)
    let bubbleBuffer  = '';     // text for the current bubble only
    let remembered    = false;
    let providerUsed  = null;

    try {
      const res = await fetch('/chat/stream', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: text, session_id: sid }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addAgentMsg('**Error:** ' + esc(JSON.stringify(err.detail || err)));
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf    = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        sseBuf += decoder.decode(value, { stream: true });
        const lines = sseBuf.split('\n');
        sseBuf = lines.pop();   // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); }
          catch { continue; }

          if (event.type === 'thinking_chars') {
            _showThinking('received ' + event.count.toLocaleString() + ' chars');

          } else if (event.type === 'tool_call') {
            console.debug('[agent] tool_call:', event.name, event.args);
            // Finalize the current text bubble before appending tool steps,
            // then reset so the next text_chunk creates a new bubble after them.
            if (agentMd) {
              agentMd.innerHTML = renderMarkdown(bubbleBuffer);
              setTimeout(() => renderMath(agentMd), 0);
              agentMd = null;
              bubbleBuffer = '';
            }
            addStep('tool-call', event.name, event.args);
            if (event.name === 'remember') remembered = true;
            _showThinking('');

          } else if (event.type === 'tool_result') {
            console.debug('[agent] tool_result:', event.name,
              String(event.result ?? '').slice(0, 120));
            addStep('tool-result', event.name, event.result);
            _showThinking('');

          } else if (event.type === 'text_chunk') {
            if (!agentMd) {
              agentMd = createAgentBubble(null);
              _hideThinking();
            }
            textBuffer   += event.text;
            bubbleBuffer += event.text;
            agentMd.innerHTML = renderStreamingMarkdown(bubbleBuffer);
            scheduleMathRender(agentMd);
            scrollFeed();

          } else if (event.type === 'done') {
            providerUsed = event.provider;
            console.debug('[agent] done, provider:', providerUsed,
              'response chars:', textBuffer.length);
            if (agentMd) {
              agentMd.innerHTML = renderMarkdown(bubbleBuffer);
              setTimeout(() => renderMath(agentMd), 0);

              const primary = 'gemini-gemma4-31b';
              if (providerUsed && providerUsed !== primary) {
                const tag = document.createElement('div');
                tag.className = 'fallback-tag';
                tag.textContent = `via ${providerUsed}`;
                agentMd.parentElement.insertBefore(tag, agentMd);
              }
            }
            if (remembered && document.getElementById('mem-panel').classList.contains('open'))
              loadMemories();
            if (document.getElementById('sessions-panel').classList.contains('open'))
              loadSessions();

          } else if (event.type === 'error') {
            console.error('[agent] error:', event.detail);
            addAgentMsg('**Error:** ' + esc(event.detail || 'Unknown error'));
          }
        }
      }

    } catch (e) {
      addAgentMsg('**Error:** ' + String(e));
    } finally {
      sendBtn.disabled = false;
      _hideThinking();
      input.focus();
    }
  }

  // ── Input auto-grow ───────────────────────────────────────

  function resetInputHeight() {
    input.style.height = '36px';
    input.style.overflowY = 'hidden';
  }

  input.addEventListener('input', () => {
    input.style.height = '36px';
    const h = Math.min(input.scrollHeight, 120);
    input.style.height = h + 'px';
    input.style.overflowY = input.scrollHeight > 120 ? 'auto' : 'hidden';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ── Init ──────────────────────────────────────────────────

  loadHistory();
  input.focus();
</script>
</body>
</html>
