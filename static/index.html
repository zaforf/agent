<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Marked (markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <!-- highlight.js (syntax highlighting) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>

  <!-- KaTeX (LaTeX math) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg:          #f7f6f3;
      --surface:     #ffffff;
      --panel:       #f2f1ee;
      --border:      #e3e2de;
      --border-2:    #ccc9c4;
      --text:        #1a1917;
      --text-2:      #6b6966;
      --text-3:      #a8a5a1;
      --user-bg:     #1a1917;
      --user-text:   #faf9f6;
      --accent:      #2563eb;
      --call-accent:   #507a64;
      --result-accent: #4a4f4d;
      --danger:      #dc2626;
      --radius:      8px;
      --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono:        'Menlo', 'Consolas', 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Side panels (fixed overlay drawers) ────────────── */

    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      z-index: 50;
      transition: transform 0.2s ease;
    }
    #panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 45;
      display: none;
    }
    #panel-backdrop.open { display: block; }
    #sessions-panel {
      left: 0;
      transform: translateX(-100%);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0,0,0,0.07);
    }
    #mem-panel {
      right: 0;
      transform: translateX(100%);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0,0,0,0.07);
    }
    #sessions-panel.open,
    #mem-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-header-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Sessions */
    .sess-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent; /* reserve space — prevents layout shift on active */
    }
    .sess-item:hover  { background: var(--panel); }
    .sess-item.active { background: var(--surface); border-color: var(--border); }
    .sess-preview {
      font-size: 12.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sess-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sess-title.is-preview {
      font-weight: 400;
      color: var(--text-3);
      -webkit-line-clamp: 1;
    }
    .sess-meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }
    .sess-row { display: flex; align-items: flex-start; gap: 4px; }
    .sess-del {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
      opacity: 0;
      flex-shrink: 0;
    }
    .sess-item:hover .sess-del { opacity: 1; }
    .sess-del:hover { color: var(--danger); }

    /* Memories */
    .mem-entry {
      padding: 7px 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border-radius: 5px;
    }
    .mem-entry:hover { background: var(--panel); }
    .mem-text { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text); line-height: 1.5; }
    .mem-del {
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
      transition: color 0.1s;
    }
    .mem-entry:hover .mem-del { color: var(--text-3); }
    .mem-del:hover { color: var(--danger) !important; }

    /* ── Chat column ─────────────────────────────────────── */

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-anchor: none;
      padding: 24px 16px;
    }

    /* Constrain content width, centered */
    .msg-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message rows */
    .row { display: flex; }
    .row.user  { justify-content: flex-end; }
    .row.agent { justify-content: flex-start; }
    .row.step                    { justify-content: flex-start; margin-top: -10px; }
    .row:not(.step) + .row.step  { margin-top: 1px; }

    /* Bubbles */
    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      word-break: break-word;
      line-height: 1.6;
    }

    .user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      max-width: 75%;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .agent .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      max-width: 88%;
      font-size: 14px;
    }

    /* Tool steps — shared */
    .step .bubble {
      font-family: var(--font);
      font-size: 11.5px;
      padding: 5px 10px;
      max-width: 88%;
      cursor: pointer;
      user-select: none;
    }
    /* Tool call / result */
    .tool-call .bubble,
    .tool-result .bubble {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Direction chip — colored square with simple keyboard symbol */
    .step-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
      font-family: var(--mono);
      line-height: 1;
    }
    .tool-call .step-tag   { background: var(--call-accent); }
    .tool-result .step-tag { background: var(--result-accent); }

    /* Step header row */
    .step-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .step-meta {
      font-weight: normal;
      opacity: 0.5;
      font-size: 10px;
    }
    /* Step body (collapsed by default) */
    .step-body {
      display: none;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      cursor: text;
      max-height: 140px;
      overflow-y: auto;
    }
    .bubble.expanded .step-body { display: block; }

    /* Fallback tag */
    .fallback-tag {
      font-size: 10.5px;
      color: var(--text-3);
      margin-bottom: 6px;
      font-style: italic;
    }

    /* ── Markdown content ────────────────────────────────── */

    .md-content p          { margin: 0.55em 0; }
    .md-content p:first-child { margin-top: 0; }
    .md-content p:last-child  { margin-bottom: 0; }
    .md-content h1,.md-content h2,.md-content h3,
    .md-content h4,.md-content h5,.md-content h6 {
      margin: 1em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .md-content h1 { font-size: 1.3em; }
    .md-content h2 { font-size: 1.15em; }
    .md-content h3 { font-size: 1.05em; }
    .md-content ul,.md-content ol { padding-left: 1.4em; margin: 0.45em 0; }
    .md-content li { margin: 0.2em 0; }
    .md-content blockquote {
      border-left: 3px solid var(--border-2);
      margin: 0.6em 0;
      padding: 0.3em 0.8em;
      color: var(--text-2);
    }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 13px; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .md-content th { background: var(--panel); font-weight: 600; }
    .md-content code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.35em;
    }
    .md-content pre {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0.65em 0;
    }
    .md-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.55;
    }

    /* Code block wrapper (copy button + syntax highlight) */
    .code-block {
      position: relative;
      margin: 0.65em 0;
    }
    .code-block pre { margin: 0; }
    /* Let the pre container own the background; hljs adds only color spans */
    .code-block .hljs { background: transparent; padding: 0; }
    .copy-btn {
      position: absolute;
      top: 7px;
      right: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-2);
      font-family: var(--font);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
      user-select: none;
      z-index: 1;
    }
    .code-block:hover .copy-btn,
    .copy-btn:focus { opacity: 1; }
    .copy-btn.copied { color: var(--call-accent); border-color: var(--call-accent); opacity: 1; }
    @media (max-width: 760px) { .copy-btn { opacity: 0.75; } }
    .md-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md-content strong { font-weight: 600; }

    /* User bubble: keep plain text */
    .user .bubble code {
      font-family: var(--mono);
      font-size: 0.875em;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      padding: 0.1em 0.3em;
    }

    /* ── Bottom bar ──────────────────────────────────────── */

    #bar-wrap {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 16px;
      position: relative;
    }
    #bar {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      min-height: 36px;
      max-height: 120px;
      line-height: 1.45;
      overflow-y: auto;
      transition: border-color 0.1s;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
    }
    #input:focus { border-color: var(--accent); }
    #input:empty::before {
      content: attr(data-placeholder);
      color: var(--text-3);
      pointer-events: none;
    }

    /* File chip — inline inside #input, same metrics as surrounding text */
    .file-chip {
      background: var(--panel);
      border: 1px solid var(--border-2);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text-2);
      user-select: none;
      cursor: default;
      white-space: nowrap;
    }

    /* Paste chip — large paste collapsed into a compact inline placeholder */
    .paste-chip {
      background: var(--panel);
      border: 1px solid var(--border-2);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text-2);
      user-select: none;
      cursor: default;
      white-space: nowrap;
    }

    /* File chips displayed in sent user bubble */
    .msg-files {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 5px;
    }
    .msg-file-chip {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 12px;
      font-family: var(--mono);
      white-space: nowrap;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Drag-over overlay */
    #chat { position: relative; }
    #drag-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(37, 99, 235, 0.07);
      border: 2px dashed var(--accent);
      border-radius: 4px;
      z-index: 20;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--accent);
      pointer-events: none;
    }
    #drag-overlay.active { display: flex; }

    #thinking-ind {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 16px;
      right: 16px;
      max-width: 720px;
      margin: 0 auto;
      padding: 5px 0;
      font-size: 13px;
      color: var(--text-3);
    }
    #thinking-ind.active { display: block; }

    /* Buttons — all same height (36px) */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      white-space: nowrap;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
    }
    .btn-send {
      background: var(--user-bg);
      color: var(--user-text);
    }
    .btn-send:hover:not(:disabled) { background: #2d2d2c; }
    .btn-send.stop-state { background: var(--call-accent); color: #fff; }
    .btn-send.stop-state:hover:not(:disabled) { background: #446b57; }
    .btn-send:disabled { opacity: 0.35; cursor: default; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 0;
      width: 36px;
      font-size: 15px;
    }
    .btn-icon:hover { background: var(--panel); color: var(--text); }
    .btn-icon.active { background: var(--panel); border-color: var(--border-2); color: var(--text); }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 11px;
      height: 26px;
      padding: 0 8px;
    }
    .btn-sm:hover { background: var(--border); color: var(--text); }


    /* ── Misc ────────────────────────────────────────────── */

    .empty-hint {
      color: var(--text-3);
      font-size: 12.5px;
      text-align: center;
      padding: 20px 10px;
    }

    /* Scrollbar (webkit) */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

    /* ── Ephemeral explain tooltip ───────────────────────── */
    .token-counter {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-3);
      font-family: var(--mono);
      white-space: nowrap;
      pointer-events: none;
    }

    #explain-tooltip {
      position: fixed;
      z-index: 200;
      width: 340px;
      max-width: calc(100vw - 16px);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 13px;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #explain-tooltip.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #explain-tooltip.loading {
      color: var(--text-3);
      font-style: italic;
    }

    @media (max-width: 760px) {
      .side-panel {
        width: 100vw;
        max-width: 100vw;
        z-index: 60;
      }
      .panel-header { padding: 10px 12px; }
      #messages { padding: 14px 10px; }
      .msg-inner { gap: 12px; }
      #bar-wrap { padding: 8px 10px; }
      #bar { gap: 6px; }
      .btn { padding: 0 10px; }
      .btn-icon { padding: 0; width: 32px; }
      .agent .bubble { max-width: 94%; }
      .user .bubble { max-width: 86%; }
    }
  </style>
</head>
<body>

<div id="panel-backdrop" onclick="closePanels()"></div>

<!-- Sessions panel -->
<div id="sessions-panel" class="side-panel">
  <div class="panel-header">
    <span class="panel-header-title">Sessions</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" onclick="newSession()">+ New</button>
      <button class="btn btn-sm" onclick="closePanels()">✕</button>
    </div>
  </div>
  <div id="sess-list" class="panel-body"></div>
</div>

<!-- Chat -->
<div id="chat">
  <div id="drag-overlay">Drop files to attach</div>
  <div id="messages">
    <div class="msg-inner" id="msg-inner"></div>
  </div>
  <div id="bar-wrap">
    <div id="thinking-ind"><span id="thinking-lbl"></span><span id="thinking-dots-txt"></span></div>
    <div id="bar">
      <button class="btn btn-icon" id="btn-sessions" onclick="togglePanel('sessions-panel','btn-sessions')" title="Sessions">☰</button>
      <button class="btn btn-icon" id="btn-attach" onclick="document.getElementById('file-input').click()" title="Attach file">+</button>
      <input type="file" id="file-input" style="display:none" multiple
             accept="image/*,.pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.json,.csv,.html,.css,.yaml,.yml,.toml,.sh,.c,.cpp,.h,.java,.rs,.go">
      <div id="input" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Message…"></div>
      <button class="btn btn-send" id="send-btn" onclick="sendOrStop()">Send</button>
      <button class="btn btn-icon" id="btn-mem" onclick="togglePanel('mem-panel','btn-mem')" title="Memories">◉</button>
    </div>
    <span class="token-counter" id="token-text">—</span>
  </div>
</div>

<!-- Memories panel -->
<div id="mem-panel" class="side-panel">
  <div class="panel-header">
    <span class="panel-header-title">Memories</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" onclick="loadMemories()">↺ Refresh</button>
      <button class="btn btn-sm" onclick="closePanels()">✕</button>
    </div>
  </div>
  <div id="mem-list" class="panel-body"></div>
</div>


<script>
  // ── Markdown / Math setup ─────────────────────────────────

  marked.setOptions({ breaks: true, gfm: true });
  marked.use({
    renderer: {
      code(token) {
        // token is an object in marked v12; guard against any calling conventions
        const text = String((token && token.text != null) ? token.text : (token || ''));
        const lang = token && typeof token === 'object' ? token.lang : null;
        let highlighted;
        try {
          if (typeof hljs === 'undefined') throw new Error('hljs not loaded');
          highlighted = (lang && hljs.getLanguage(lang))
            ? hljs.highlight(text, { language: lang }).value
            : hljs.highlightAuto(text).value;
        } catch {
          highlighted = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        return `<div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre><code class="hljs">${highlighted}</code></pre></div>\n`;
      }
    }
  });

  /**
   * CommonMark/Marked treat `\(` as "escaped (" → output is plain `(`, so KaTeX
   * never sees the delimiter. Double the backslash on LaTeX math delimiters only
   * (outside fenced ``` blocks) so the HTML text contains literal `\(` / `\[` for
   * renderMathInElement. See DESIGN §9.2.
   */
  /**
   * After delimiter doubling, `\\[` ... `\\]` / `\\(` ... `\\)` contain TeX.
   * A single `\` before newline is a CommonMark "hard line break" → Marked
   * emits `<br>`, which splits the formula and breaks KaTeX. TeX row breaks
   * need `\\` before newline; normalize lone `\` + NL → `\\` + NL inside math.
   */
  function _normalizeTeXRowBreaksInMathInner(inner) {
    let s = inner;
    // Lone `\` + optional spaces + newline: Markdown hard break → TeX `\\` + NL.
    // Does not match `\\`+NL: after first `\` the next char is `\`, not \s or NL.
    s = s.replace(/(^|[^\\])\\(\s*)(\r\n|\n|\r)/g, '$1\\\\$2$3');
    // Models often emit `\ ` between matrix rows; TeX needs `\\` before next row.
    s = s.replace(/(^|[^\\])\\([ \t]+)(?=[\d(&])/g, '$1\\\\$2');
    return s;
  }

  function _doubleBackslashBeforeNewlineInMathSegments(s, open, close) {
    let i = 0;
    let out = '';
    const olen = open.length;
    const clen = close.length;
    while (i < s.length) {
      const start = s.indexOf(open, i);
      if (start === -1) {
        out += s.slice(i);
        break;
      }
      out += s.slice(i, start);
      const end = s.indexOf(close, start + olen);
      if (end === -1) {
        out += s.slice(start);
        break;
      }
      let inner = _normalizeTeXRowBreaksInMathInner(s.slice(start + olen, end));
      out += open + inner + close;
      i = end + clen;
    }
    return out;
  }

  const _MATH_NL_SENTINEL = '@@MATH_NL_SENTINEL_9f2b@@';
  const _MATH_BS_SENTINEL = '@@MATH_BS_SENTINEL_3c7d@@';

  function _encodeMathNewlinesForMarked(s, open, close) {
    let i = 0;
    let out = '';
    const olen = open.length;
    const clen = close.length;
    while (i < s.length) {
      const start = s.indexOf(open, i);
      if (start === -1) {
        out += s.slice(i);
        break;
      }
      out += s.slice(i, start);
      const end = s.indexOf(close, start + olen);
      if (end === -1) {
        out += s.slice(start);
        break;
      }
      let inner = s.slice(start + olen, end);
      inner = inner.replace(/\r\n|\n|\r/g, _MATH_NL_SENTINEL);
      out += open + inner + close;
      i = end + clen;
    }
    return out;
  }

  function _encodeMathBackslashesForMarked(s, open, close) {
    let i = 0;
    let out = '';
    const olen = open.length;
    const clen = close.length;
    while (i < s.length) {
      const start = s.indexOf(open, i);
      if (start === -1) {
        out += s.slice(i);
        break;
      }
      out += s.slice(i, start);
      const end = s.indexOf(close, start + olen);
      if (end === -1) {
        out += s.slice(start);
        break;
      }
      let inner = s.slice(start + olen, end);
      inner = inner.replace(/\\/g, _MATH_BS_SENTINEL);
      out += open + inner + close;
      i = end + clen;
    }
    return out;
  }

  function _restoreMathNewlinesFromMarkedHtml(html) {
    return String(html ?? '')
      .replaceAll(_MATH_NL_SENTINEL, '\n')
      .replaceAll(_MATH_BS_SENTINEL, '\\');
  }

  function escapeBracketMathDelimitersForMarked(raw) {
    const s = String(raw ?? '');
    const parts = s.split(/(```[\s\S]*?```)/g);
    for (let i = 0; i < parts.length; i++) {
      if (parts[i].startsWith('```')) continue;
      let chunk = parts[i]
        .replace(/\\\(/g, '\\\\(')
        .replace(/\\\)/g, '\\\\)')
        .replace(/\\\[/g, '\\\\[')
        .replace(/\\\]/g, '\\\\]');
      // Must run after delimiter doubling: open/close are 3-char sequences \\[ \\] \\( \\)
      chunk = _doubleBackslashBeforeNewlineInMathSegments(chunk, '\\\\[', '\\\\]');
      chunk = _doubleBackslashBeforeNewlineInMathSegments(chunk, '\\\\(', '\\\\)');
      // Protect TeX backslashes from Marked escapes inside math payload.
      chunk = _encodeMathBackslashesForMarked(chunk, '\\\\[', '\\\\]');
      chunk = _encodeMathBackslashesForMarked(chunk, '\\\\(', '\\\\)');
      chunk = _encodeMathNewlinesForMarked(chunk, '\\\\[', '\\\\]');
      chunk = _encodeMathNewlinesForMarked(chunk, '\\\\(', '\\\\)');
      parts[i] = chunk;
    }
    return parts.join('');
  }

  function renderMarkdown(text) {
    const html = _restoreMathNewlinesFromMarkedHtml(
      marked.parse(escapeBracketMathDelimitersForMarked(text))
    );
    return html.replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ');
  }

  /**
   * Like renderMarkdown but tolerates incomplete code blocks that occur
   * mid-stream. Closes any unclosed ``` fence or lone ` backtick so the
   * browser DOM stays well-formed while chunks are still arriving.
   */
  function renderStreamingMarkdown(text) {
    // Close unclosed triple-backtick fences
    const fences = (text.match(/^```/gm) || []).length;
    if (fences % 2 !== 0) text += '\n```';
    // Remove completed fences, then count remaining lone backticks
    const noFences = text
      .replace(/```[\s\S]*?```/g, '')
      .replace(/```[\s\S]*$/, '');
    const singles = (noFences.match(/`/g) || []).length;
    if (singles % 2 !== 0) text += '`';
    return _restoreMathNewlinesFromMarkedHtml(
      marked.parse(escapeBracketMathDelimitersForMarked(text))
    );
  }

  function renderMath(el) {
    if (typeof renderMathInElement === 'undefined') return;
    renderMathInElement(el, {
      // Primary delimiters are bracket LaTeX; `$...$` is tolerated as fallback
      // for model slip-ups so inline variables still render.
      delimiters: [
        { left: '\\[', right: '\\]', display: true  },
        { left: '\\(', right: '\\)', display: false },
        { left: '$',  right: '$',  display: false },
      ],
      throwOnError: false,
      errorColor:   'inherit',
    });
  }

  // ── State ─────────────────────────────────────────────────
  const feed    = document.getElementById('msg-inner');
  const messagesEl = document.getElementById('messages');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const tokenText = document.getElementById('token-text');
  let stickToBottom = true;
  let mathRenderTimer = null;

  let sid = localStorage.getItem('sid') || newSid();
  let sessionsCache = [];
  localStorage.setItem('sid', sid);

  function newSid() { return Math.random().toString(36).slice(2); }

  // ── Utils ─────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function copyCode(btn) {
    const code = btn.nextElementSibling.querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1200);
    }).catch(() => {});
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const now = new Date();
    if (d.toDateString() === now.toDateString())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function closePanels() {
    document.getElementById('sessions-panel').classList.remove('open');
    document.getElementById('mem-panel').classList.remove('open');
    document.getElementById('btn-sessions').classList.remove('active');
    document.getElementById('btn-mem').classList.remove('active');
    document.getElementById('panel-backdrop').classList.remove('open');
  }

  function togglePanel(id, btnId) {
    const panel = document.getElementById(id);
    const opening = !panel.classList.contains('open');
    closePanels();
    if (!opening) return;
    panel.classList.add('open');
    if (btnId) document.getElementById(btnId).classList.add('active');
    document.getElementById('panel-backdrop').classList.add('open');
    if (id === 'sessions-panel') loadSessions();
    if (id === 'mem-panel')      loadMemories();
  }

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  }

  function scheduleMathRender(el) {
    if (!el || mathRenderTimer) return;
    mathRenderTimer = setTimeout(() => {
      renderMath(el);
      mathRenderTimer = null;
      if (stickToBottom) scrollFeed(true);
    }, 80);
  }

  let _navDest      = null;  // destination scrollTop during nav animation
  let _navStopTimer = null;  // cleared 80 ms after scrolling stops

  messagesEl.addEventListener('scroll', () => {
    stickToBottom = isNearBottom(messagesEl);
    // Keep _navDest alive while scrolling; clear shortly after it settles.
    clearTimeout(_navStopTimer);
    _navStopTimer = setTimeout(() => { _navDest = null; }, 80);
  });

  /** Run after history DOM + KaTeX so heights match rendered math (Bugbot: defer scroll past setTimeout math). */
  function scrollToLastAssistantAfterLayout() {
    return new Promise(resolve => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const assistants = feed.querySelectorAll('.row.agent');
          if (!assistants.length) {
            scrollFeed(true);
            stickToBottom = true;
            resolve();
            return;
          }
          scrollFeed(true);
          stickToBottom = true;
          resolve();
        });
      });
    });
  }

  // ── Message rendering ─────────────────────────────────────

  function addUserMsg(text, displayAttachments = [], shouldScroll = true) {
    const row = document.createElement('div');
    row.className = 'row user';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if (displayAttachments.length) {
      const filesDiv = document.createElement('div');
      filesDiv.className = 'msg-files';
      for (const att of displayAttachments) {
        const chip = document.createElement('span');
        chip.className = 'msg-file-chip';
        const name = att.filename || 'file';
        chip.textContent = name.length > 24 ? name.slice(0, 21) + '…' : name;
        filesDiv.appendChild(chip);
      }
      bub.appendChild(filesDiv);
    }
    if (text) {
      const textDiv = document.createElement('div');
      textDiv.textContent = text;
      bub.appendChild(textDiv);
    }
    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
  }

  /** Create an agent bubble and return its md-content div for streaming into. */
  function createAgentBubble(fallbackProvider, shouldScroll = true) {
    const row = document.createElement('div');
    row.className = 'row agent';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    if (fallbackProvider) {
      const tag = document.createElement('div');
      tag.className = 'fallback-tag';
      tag.textContent = `via ${fallbackProvider}`;
      bub.appendChild(tag);
    }
    const md = document.createElement('div');
    md.className = 'md-content';
    bub.appendChild(md);
    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
    return md;
  }

  /** Render a complete agent message. `syncMath`: history load renders KaTeX before scroll anchor runs. */
  function addAgentMsg(text, shouldScroll = true, syncMath = false) {
    const md = createAgentBubble(null, shouldScroll);
    md.innerHTML = renderMarkdown(text);
    if (syncMath) renderMath(md);
    else setTimeout(() => renderMath(md), 0);
  }

  /** Add a collapsible tool step row. */
  function addStep(type, name, payload, shouldScroll = true) {
    const row = document.createElement('div');
    row.className = `row step ${type}`;

    const bub = document.createElement('div');
    bub.className = 'bubble';

    const sym = type === 'tool-call' ? '>' : '<';

    const header = document.createElement('div');
    header.className = 'step-header';

    // Meta hint shown in the collapsed header
    let meta = '';
    if (type === 'tool-call' && typeof payload === 'object') {
      const first = Object.values(payload)[0];
      if (first != null) {
        const s = String(first);
        meta = s.length > 50 ? s.slice(0, 50) + '…' : s;
      }
    } else if (type === 'tool-result') {
      const raw = String(payload ?? '');
      meta = raw.length > 80 ? raw.length.toLocaleString() + ' chars' : '';
    }

    header.innerHTML =
      `<span class="step-tag">${sym}</span>` +
      `<strong>${esc(name)}</strong>` +
      (meta ? `<span class="step-meta">${esc(meta)}</span>` : '');
    bub.appendChild(header);

    const body = document.createElement('div');
    body.className = 'step-body';
    if (type === 'tool-call' && typeof payload === 'object') {
      body.textContent = Object.entries(payload)
        .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
        .join('\n');
    } else {
      // Collapse whitespace/newlines into single spaces, then truncate
      let text = String(payload ?? '')
        .replace(/\s*\n\s*/g, ' ')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
      const MAX = 600;
      if (text.length > MAX) text = text.slice(0, MAX) + ' …';
      body.textContent = text;
    }
    bub.appendChild(body);

    bub.addEventListener('click', () => bub.classList.toggle('expanded'));

    row.appendChild(bub);
    feed.appendChild(row);
    if (shouldScroll) scrollFeed();
    return row;
  }

  function scrollFeed(force = false) {
    if (!force && !stickToBottom && !isNearBottom(messagesEl)) return;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    stickToBottom = true;
  }

  // ── History ───────────────────────────────────────────────

  async function updateTokenCount() {
    try {
      const res = await fetch(`/tokens/${sid}`);
      const data = await res.json();
      const tokens = data.tokens || 0;
      const pct = Math.min(100, (tokens / 256000) * 100);
      tokenText.textContent = tokens.toLocaleString() + ' (' + pct.toFixed(1) + '%)';
    } catch (e) {
      console.error('Token update failed:', e);
    }
  }

  async function loadHistory() {
    messagesEl.style.visibility = 'hidden';
    try {
      feed.innerHTML = '';
      const res  = await fetch(`/sessions/${sid}/history`);
      const data = await res.json();
      for (const msg of data.messages) {
        if (msg.role === 'user') {
          addUserMsg(msg.content, msg.attachments || [], false);
        } else {
          // Render stored tool steps before the assistant message
          for (const step of (msg.steps || [])) {
            if (step.type === 'tool_call')
              addStep('tool-call', step.name, step.args, false);
            else if (step.type === 'tool_result')
              addStep('tool-result', step.name, step.result, false);
          }
          addAgentMsg(msg.content, false, true);
        }
      }
      if (!data.messages.length) {
        feed.innerHTML = '<div class="empty-hint">New session — say something.</div>';
      }
      await scrollToLastAssistantAfterLayout();
      highlightSession();
    } finally {
      messagesEl.style.visibility = '';
      await updateTokenCount();
    }
  }

  // ── Sessions ──────────────────────────────────────────────

  async function loadSessions() {
    const list = document.getElementById('sess-list');
    list.innerHTML = '';
    const res  = await fetch('/sessions');
    const data = await res.json();
    sessionsCache = Array.isArray(data.sessions) ? data.sessions : [];
    if (!data.sessions.length) {
      list.innerHTML = '<div class="empty-hint">No sessions yet.</div>';
      return;
    }
    for (const s of data.sessions) {
      const el = document.createElement('div');
      el.className = 'sess-item' + (s.session_id === sid ? ' active' : '');
      el.dataset.sid = s.session_id;
      el.innerHTML = `
        <div class="sess-row">
          <div style="flex:1;min-width:0">
            <div class="sess-title${s.title ? '' : ' is-preview'}">${esc(s.title || s.preview || '(empty)')}</div>
            <div class="sess-meta"><span>${s.count} turn${s.count === 1 ? '' : 's'}</span><span>${fmtDate(s.last_ts)}</span></div>
          </div>
          <button class="sess-del" title="Delete" onclick="deleteSession('${s.session_id}',event)">×</button>
        </div>`;
      el.addEventListener('click', () => { void switchSession(s.session_id); });
      list.appendChild(el);
    }
  }

  function highlightSession() {
    document.querySelectorAll('.sess-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sid === sid);
    });
  }

  async function switchSession(newSid) {
    if (currentStreamController) {
        currentStreamController.abort();
        currentStreamController = null;
    }
    isStreaming = false;
    sendBtn.textContent = 'Send';
    sendBtn.classList.remove('stop-state');
    _hideThinking();

    sid = newSid;
    localStorage.setItem('sid', sid);
    await loadHistory();
    highlightSession();
    input.focus();
  }

  function switchSessionByIndex(idx0) {
    if (!Number.isInteger(idx0) || idx0 < 0 || idx0 >= sessionsCache.length) return;
    void switchSession(sessionsCache[idx0].session_id);
  }

  async function newSession() {
    sid = newSid();
    localStorage.setItem('sid', sid);
    await loadHistory();
    if (document.getElementById('sessions-panel').classList.contains('open')) loadSessions();
    input.focus();
  }

  async function deleteSession(id, e) {
    if (e && e.stopPropagation) e.stopPropagation();
    if (!confirm('Delete this session?')) return;
    await fetch(`/sessions/${id}`, { method: 'DELETE' });
    if (id === sid) newSession();
    else loadSessions();
  }

  // ── Memories ──────────────────────────────────────────────

  async function loadMemories() {
    const list = document.getElementById('mem-list');
    list.innerHTML = '<div class="empty-hint">Loading…</div>';
    const res  = await fetch('/memories');
    const data = await res.json();
    list.innerHTML = '';
    if (!data.memories.length) {
      list.innerHTML = '<div class="empty-hint">No memories yet.</div>';
      return;
    }
    for (const m of data.memories) {
      const el = document.createElement('div');
      el.className = 'mem-entry';
      el.innerHTML = `
        <div class="mem-text">${esc(m.memory)}</div>
        <button class="mem-del" onclick="deleteMem('${m.id}',this)">×</button>`;
      list.appendChild(el);
    }
  }

  async function deleteMem(id, btn) {
    btn.disabled = true;
    await fetch(`/memories/${id}`, { method: 'DELETE' });
    btn.closest('.mem-entry').remove();
    if (!document.getElementById('mem-list').querySelector('.mem-entry'))
      document.getElementById('mem-list').innerHTML = '<div class="empty-hint">No memories yet.</div>';
  }

  // ── Thinking indicator ────────────────────────────────────

  const thinkEl   = document.getElementById('thinking-ind');
  const thinkLbl  = document.getElementById('thinking-lbl');
  const thinkDots = document.getElementById('thinking-dots-txt');
  const _DOT_FRAMES = ['.', '..', '...', '..', '.'];
  let _dotIdx = 0, _dotTimer = null;
  // Throttle thinking_chars DOM updates to ≤10/s so rapid events don't starve
  // the renderer. performance.now() timestamp of last DOM write (issue #46 bug 1).
  let _thinkLastUpdate = 0;

  function _showThinking(label) {
    thinkLbl.textContent = label || '';
    thinkEl.className = 'active';
    if (!_dotTimer) {
      _dotIdx = 0;
      thinkDots.textContent = _DOT_FRAMES[0];
      _dotTimer = setInterval(() => {
        _dotIdx = (_dotIdx + 1) % _DOT_FRAMES.length;
        thinkDots.textContent = _DOT_FRAMES[_dotIdx];
      }, 320);
    }
  }

  function _hideThinking() {
    thinkEl.className = '';
    clearInterval(_dotTimer);
    _dotTimer = null;
    thinkLbl.textContent = '';
    thinkDots.textContent = '';
  }

  // ── Send (streaming) ──────────────────────────────────────

  let currentStreamController = null;
  let isStreaming = false;

  function sendOrStop() {
    if (isStreaming) {
      cancelStream();
      return;
    }
    send();
  }

  async function cancelStream() {
    if (!currentStreamController) return;
    try {
      await fetch('/chat/stream/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid }),
      });
    } catch {
      // Best effort cancel; abort client stream regardless.
    }
    currentStreamController.abort();
  }

  async function send() {
    const streamSid = sid;
    const { text, attachments } = getInputContent();
    if ((!text && !attachments.length) || isStreaming) return;
    clearInput();
    isStreaming = true;
    sendBtn.textContent = 'Stop';
    sendBtn.classList.add('stop-state');
    _showThinking('');

    const hint = feed.querySelector('.empty-hint');
    if (hint) hint.remove();

    addUserMsg(text, attachments.map(a => ({ type: a.type, filename: a.filename })));
    stickToBottom = true;

    let agentMd       = null;   // md-content div for the current text segment
    let textBuffer    = '';     // full response text (all segments)
    let bubbleBuffer  = '';     // text for the current bubble only
    let remembered    = false;
    let providerUsed  = null;

    // Char-by-char animation state
    let _charQueue   = '';
    let _charDrainId = null;

    function _hasMath(t) { return /\\\[|\\\(|\$\S/.test(t); }

    function _flushQueue() {
      if (_charDrainId !== null) { cancelAnimationFrame(_charDrainId); _charDrainId = null; }
      if (_charQueue) { bubbleBuffer += _charQueue; _charQueue = ''; }
    }

    function _drainCharQueue() {
      if (!_charQueue) { _charDrainId = null; return; }
      const take = Math.max(1, Math.ceil(_charQueue.length / 8));
      bubbleBuffer += _charQueue.slice(0, take);
      _charQueue    = _charQueue.slice(take);
      if (agentMd) {
        const savedTop = stickToBottom ? null : messagesEl.scrollTop;
        agentMd.innerHTML = renderStreamingMarkdown(bubbleBuffer);
        if (_hasMath(bubbleBuffer))
          renderMath(agentMd);
        if (stickToBottom) scrollFeed(true);
        else messagesEl.scrollTop = savedTop;
      }
      _charDrainId = requestAnimationFrame(_drainCharQueue);
    }

    try {
      // Yield so the browser can paint the user bubble before we open the
      // network stream (otherwise some engines batch layout until after fetch
      // work starts, which feels like the message appears with the first SSE).
      await new Promise(requestAnimationFrame);
      const streamController = new AbortController();
      currentStreamController = streamController;
      const res = await fetch('/chat/stream', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: streamController.signal,
        body:    JSON.stringify({
          message:     text,
          session_id:  sid,
          attachments: attachments.map(a => ({
            type:     a.type,
            filename: a.filename,
            content:  a.content,
          })),
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addAgentMsg('**Error:** ' + esc(JSON.stringify(err.detail || err)));
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let sseBuf    = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        sseBuf += decoder.decode(value, { stream: true });
        const lines = sseBuf.split('\n');
        sseBuf = lines.pop();   // keep incomplete line

        for (const line of lines) {
          if (sid !== streamSid) break;
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); }
          catch { continue; }

          if (event.type === 'thinking_chars') {
            const now = performance.now();
            if (now - _thinkLastUpdate >= 100) {
              _showThinking('received ' + event.count.toLocaleString() + ' chars');
              _thinkLastUpdate = now;
            }

          } else if (event.type === 'thinking_done') {
            _thinkLastUpdate = 0;  // reset throttle for next block; label stays until text_chunk

          } else if (event.type === 'memory_prefetch') {
            console.debug('[agent] memory_prefetch:', event.count, event.memories);
            const memLines = (event.memories || []).map(m => `• ${m}`).join('\n');
            addStep('tool-result', 'memory', memLines || `${event.count} memories`);

          } else if (event.type === 'tool_call') {
            console.debug('[agent] tool_call:', event.name, event.args);
            _flushQueue();
            // Finalize the current text bubble before appending tool steps,
            // then reset so the next text_chunk creates a new bubble after them.
            if (agentMd) {
              agentMd.innerHTML = renderMarkdown(bubbleBuffer);
              renderMath(agentMd);
              agentMd = null;
              bubbleBuffer = '';
            }
            addStep('tool-call', event.name, event.args);
            if (event.name === 'remember') remembered = true;
            _showThinking('');

          } else if (event.type === 'tool_result') {
            console.debug('[agent] tool_result:', event.name,
              String(event.result ?? '').slice(0, 120));
            addStep('tool-result', event.name, event.result);
            _showThinking('');

          } else if (event.type === 'text_chunk') {
            _hideThinking();
            if (!agentMd) agentMd = createAgentBubble(null);
            textBuffer  += event.text;
            _charQueue  += event.text;
            if (_charDrainId === null) _charDrainId = requestAnimationFrame(_drainCharQueue);

          } else if (event.type === 'done') {
            providerUsed = event.provider;
            _flushQueue();
            console.debug('[agent] done, provider:', providerUsed,
              'response chars:', textBuffer.length);
            if (event.turn_messages && event.turn_messages.length === 1 && event.turn_messages[0].role === 'assistant') {
              // nuke_chat resets history server-side; refresh UI from canonical display history
              await loadHistory();
              if (document.getElementById('sessions-panel').classList.contains('open')) loadSessions();
              _hideThinking();
              continue;
            }
            if (agentMd) {
              agentMd.innerHTML = renderMarkdown(bubbleBuffer);
              renderMath(agentMd);
              if (stickToBottom) requestAnimationFrame(() => scrollFeed(true));

              const primary = 'gemini-gemma4-31b';
              if (providerUsed && providerUsed !== primary) {
                const tag = document.createElement('div');
                tag.className = 'fallback-tag';
                tag.textContent = `via ${providerUsed}`;
                agentMd.parentElement.insertBefore(tag, agentMd);
              }
            }
            if (remembered && document.getElementById('mem-panel').classList.contains('open'))
              loadMemories();
            if (document.getElementById('sessions-panel').classList.contains('open'))
              loadSessions();

          } else if (event.type === 'cancelled') {
            _flushQueue();
            if (agentMd) {
              const note = document.createElement('div');
              note.className = 'fallback-tag';
              note.textContent = 'generation stopped';
              agentMd.parentElement.insertBefore(note, agentMd);
            }
          } else if (event.type === 'error') {
            console.error('[agent] error:', event.detail);
            addAgentMsg('**Error:** ' + esc(event.detail || 'Unknown error'));
          }
        }
      }

    } catch (e) {
      if (!(e && e.name === 'AbortError')) {
        addAgentMsg('**Error:** ' + String(e));
      }
    } finally {
      _flushQueue();
      currentStreamController = null;
      isStreaming = false;
      sendBtn.textContent = 'Send';
      sendBtn.classList.remove('stop-state');
      _hideThinking();
      input.focus();
      updateTokenCount();
    }
  }

  // ── Contenteditable helpers ───────────────────────────────

  // fileId → { type, filename, content }
  const attachedFiles = new Map();
  // pasteId → full pasted text string
  const pastedTexts = new Map();

  const _PASTE_THRESHOLD_LINES = 5;
  const _PASTE_THRESHOLD_CHARS = 500;

  function clearInput() {
    input.innerHTML = '';
    attachedFiles.clear();
    pastedTexts.clear();
  }

  /** Parse the contenteditable div into { text, attachments }. */
  function getInputContent() {
    const attachments = [];
    const textParts   = [];

    function walk(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        textParts.push(node.textContent);
      } else if (node.nodeName === 'BR') {
        textParts.push('\n');
      } else if (node.classList?.contains('file-chip')) {
        const fileData = attachedFiles.get(node.dataset.fileId);
        if (fileData) attachments.push(fileData);
      } else if (node.classList?.contains('paste-chip')) {
        const pasted = pastedTexts.get(node.dataset.pasteId);
        if (pasted != null) textParts.push(pasted);
      } else {
        const isBlock = node.nodeName === 'DIV' || node.nodeName === 'P';
        if (isBlock && textParts.length && !textParts[textParts.length - 1].endsWith('\n')) {
          textParts.push('\n');
        }
        for (const child of node.childNodes) walk(child);
      }
    }
    for (const child of input.childNodes) walk(child);

    return { text: textParts.join('').trim(), attachments };
  }

  /** Insert a chip span at the current cursor position (or append). */
  function insertChip(fileId, filename) {
    const chip = document.createElement('span');
    chip.className       = 'file-chip';
    chip.contentEditable = 'false';
    chip.dataset.fileId  = fileId;
    chip.textContent     = filename.length > 24 ? filename.slice(0, 21) + '…' : filename;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && input.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(chip);
      range.setStartAfter(chip);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      input.appendChild(chip);
    }
    input.focus();
  }

  /** Collapse a large paste into a compact inline chip; store full text for serialization. */
  function insertPasteChip(pasteId, text) {
    const nLines = text.split('\n').length;
    const label  = nLines > 1 ? `[paste - ${nLines} lines]` : `[paste - ${text.length} chars]`;

    const chip = document.createElement('span');
    chip.className       = 'paste-chip';
    chip.contentEditable = 'false';
    chip.dataset.pasteId = pasteId;
    chip.textContent     = label;

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && input.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(chip);
      range.setStartAfter(chip);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      input.appendChild(chip);
    }
    input.focus();
  }

  // ── File reading helpers ──────────────────────────────────

  const _TEXT_EXTS = new Set([
    'txt','md','py','js','ts','jsx','tsx','json','csv','html','css',
    'yaml','yml','toml','sh','c','cpp','h','java','rs','go','rb','php',
    'swift','kt','r','sql','xml','ini','env',
  ]);

  function _readAsText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = e => resolve(e.target.result);
      r.onerror = reject;
      r.readAsText(file);
    });
  }

  function _readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = e => resolve(e.target.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function handleFileAttach(file) {
    const MAX = 5 * 1024 * 1024;
    if (file.size > MAX) {
      alert(`"${file.name}" exceeds the 5 MB limit.`);
      return;
    }

    const mime = file.type || '';
    const ext  = (file.name.split('.').pop() || '').toLowerCase();
    const fileId = Math.random().toString(36).slice(2);

    if (mime.startsWith('image/')) {
      const dataUrl = await _readAsDataURL(file);
      attachedFiles.set(fileId, { type: 'image', filename: file.name, content: dataUrl });
      insertChip(fileId, file.name);

    } else if (mime === 'application/pdf') {
      const fd  = new FormData();
      fd.append('file', file);
      let res;
      try { res = await fetch('/upload', { method: 'POST', body: fd }); }
      catch { alert(`Upload failed: network error`); return; }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(`Upload failed: ${err.detail || res.status}`);
        return;
      }
      const data = await res.json();
      attachedFiles.set(fileId, { type: 'text', filename: data.filename, content: data.content });
      insertChip(fileId, file.name);

    } else if (mime.startsWith('text/') || _TEXT_EXTS.has(ext)) {
      const text = await _readAsText(file);
      attachedFiles.set(fileId, { type: 'text', filename: file.name, content: text });
      insertChip(fileId, file.name);

    } else {
      alert(`Unsupported file type: ${mime || ext || 'unknown'}`);
    }
  }

  function handleFilePicker(e) {
    [...e.target.files].forEach(handleFileAttach);
    e.target.value = '';
  }

  // ── Drag-and-drop ─────────────────────────────────────────

  const chatEl      = document.getElementById('chat');
  const dragOverlay = document.getElementById('drag-overlay');
  let _dragCounter  = 0;

  chatEl.addEventListener('dragenter', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    _dragCounter++;
    dragOverlay.classList.add('active');
  });
  chatEl.addEventListener('dragleave', () => {
    _dragCounter = Math.max(0, _dragCounter - 1);
    if (_dragCounter === 0) dragOverlay.classList.remove('active');
  });
  chatEl.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  chatEl.addEventListener('drop', e => {
    e.preventDefault();
    _dragCounter = 0;
    dragOverlay.classList.remove('active');
    [...e.dataTransfer.files].forEach(handleFileAttach);
    input.focus();
  });

  // ── Input keydown / paste ─────────────────────────────────

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Global keyboard shortcuts (work even when #input is focused).
  // Chosen as Option/Alt-only to avoid overriding first-class browser shortcuts
  // like Cmd+N / Cmd+1 tab switching on macOS.
  // - Alt+N: new chat
  // - Alt+M: delete chat
  // - Alt+H: toggle sessions panel (left)
  // - Alt+L: toggle memories panel (right)
  // - Alt+O: open attachment picker
  // - Alt+K: scroll to previous user message (vim-K = up)
  // - Alt+J: scroll to next user message   (vim-J = down)
  // - Alt+1..Alt+9 / Alt+0: switch sessions 1..10
  // Tab: focus input
  function _isAltOnlyShortcutEvent(e) {
    return !!(e.altKey && !e.ctrlKey && !e.metaKey);
  }

  function _shortcutKeyId(e) {
    // Use physical key first; fall back to legacy keyCode on some mac layouts.
    return e.code || (
      e.keyCode === 78 ? 'KeyN' :
      e.keyCode === 77 ? 'KeyM' :
      e.keyCode === 74 ? 'KeyJ' :
      e.keyCode === 75 ? 'KeyK' :
      e.keyCode === 79 ? 'KeyO' :
      e.keyCode === 72 ? 'KeyH' :
      e.keyCode === 76 ? 'KeyL' :
      e.keyCode === 48 ? 'Digit0' :
      e.keyCode === 49 ? 'Digit1' :
      e.keyCode === 50 ? 'Digit2' :
      e.keyCode === 51 ? 'Digit3' :
      e.keyCode === 52 ? 'Digit4' :
      e.keyCode === 53 ? 'Digit5' :
      e.keyCode === 54 ? 'Digit6' :
      e.keyCode === 55 ? 'Digit7' :
      e.keyCode === 56 ? 'Digit8' :
      e.keyCode === 57 ? 'Digit9' :
      ''
    );
  }

  let _kbRepeat      = false;
  let _navRepeatLast = 0;
  const _NAV_REPEAT_MS = 50; // ms between steps while key is held — raise to slow down

  function _navToUserMsg(dir) {
    if (_kbRepeat) {
      const now = Date.now();
      if (now - _navRepeatLast < _NAV_REPEAT_MS) return;
      _navRepeatLast = now;
    }
    const rows = [...feed.querySelectorAll('.row.user')];
    if (!rows.length) return;
    const rowTops = rows.map(r => {
      let top = 0, el = r;
      while (el && el !== messagesEl) { top += el.offsetTop; el = el.offsetParent; }
      return top;
    });
    const st = _navDest !== null ? _navDest : messagesEl.scrollTop;
    let idx;
    if (dir === 'up') {
      idx = -1;
      for (let i = 0; i < rowTops.length; i++) { if (rowTops[i] < st + 12) idx = i; }
      if (idx === -1) idx = 0;
    } else {
      idx = rowTops.findIndex(t => t > st + 20);
      if (idx === -1) {
        // Nothing below — snap to absolute bottom.
        const bottom = messagesEl.scrollHeight - messagesEl.clientHeight;
        _navDest = bottom;
        messagesEl.scrollTo({ top: bottom, behavior: _kbRepeat ? 'instant' : 'smooth' });
        stickToBottom = true;
        return;
      }
    }
    const destTop = Math.max(0, rowTops[idx] - 16);
    _navDest = destTop;
    messagesEl.scrollTo({ top: destTop, behavior: _kbRepeat ? 'instant' : 'smooth' });
    stickToBottom = (messagesEl.scrollHeight - destTop - messagesEl.clientHeight) < 40;
  }

  function _runAltShortcutByKeyId(keyId) {
    if (keyId === 'KeyN') { newSession(); return true; }
    if (keyId === 'KeyM') { deleteSession(sid); return true; }
    if (keyId === 'KeyO') { document.getElementById('file-input').click(); return true; }
    if (keyId === 'KeyH') { togglePanel('sessions-panel', 'btn-sessions'); return true; }
    if (keyId === 'KeyL') { togglePanel('mem-panel', 'btn-mem'); return true; }
    if (keyId === 'KeyK') { _navToUserMsg('up');   return true; }
    if (keyId === 'KeyJ') { _navToUserMsg('down'); return true; }
    const digitToIndex = {
      Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Digit5: 4,
      Digit6: 5, Digit7: 6, Digit8: 7, Digit9: 8, Digit0: 9,
    };
    if (Object.prototype.hasOwnProperty.call(digitToIndex, keyId)) {
      const idx = digitToIndex[keyId];
      if (!sessionsCache.length) loadSessions().finally(() => switchSessionByIndex(idx));
      else switchSessionByIndex(idx);
      return true;
    }
    return false;
  }

  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || !_isAltOnlyShortcutEvent(e)) return;
    _kbRepeat = e.repeat;
    const keyId = _shortcutKeyId(e);
    const handled = _runAltShortcutByKeyId(keyId);
    if (!handled) return;
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
  }, true);

  // Tab focuses the input from anywhere on the page.
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.altKey && !e.ctrlKey && !e.metaKey && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
  });

  // Strip rich formatting on paste. Collapse large pastes into a compact chip.
  input.addEventListener('paste', e => {
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    const nLines = text.split('\n').length;
    if (nLines >= _PASTE_THRESHOLD_LINES || text.length >= _PASTE_THRESHOLD_CHARS) {
      const pasteId = Math.random().toString(36).slice(2);
      pastedTexts.set(pasteId, text);
      insertPasteChip(pasteId, text);
    } else {
      document.execCommand('insertText', false, text);
    }
  });

  // Clean up any stray <br> Chrome inserts when the div becomes empty.
  input.addEventListener('input', () => {
    if (!input.textContent.trim() && !input.querySelector('.file-chip, .paste-chip')) {
      input.innerHTML = '';
    }
  });

  // Wire file-input change handler.
  document.getElementById('file-input').addEventListener('change', handleFilePicker);

  // ── Contextual Query (Highlight-to-Explain + future /btw) ────────────────

  let _ephemeralCleanup = null;

  function _getExplainTooltip() {
    let tip = document.getElementById('explain-tooltip');
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'explain-tooltip';
      document.body.appendChild(tip);
    }
    return tip;
  }

  function _positionTooltip(tip, anchorRect) {
    const GAP = 8;
    const PAD = 8;
    const TIP_W = Math.min(340, window.innerWidth - 16);

    tip.style.width     = TIP_W + 'px';
    tip.style.transform = '';

    // Horizontal: center on selection, clamp to viewport.
    let left = anchorRect.left + anchorRect.width / 2 - TIP_W / 2;
    left = Math.max(PAD, Math.min(left, window.innerWidth - TIP_W - PAD));
    tip.style.left = left + 'px';

    // Measure actual height synchronously (element is in DOM, just opacity:0).
    const tipH = tip.offsetHeight;
    const above = anchorRect.top - GAP - tipH;
    const below = anchorRect.bottom + GAP;

    let top;
    if (above >= PAD) {
      top = above;
    } else if (below + tipH <= window.innerHeight - PAD) {
      top = below;
    } else {
      // Neither fits cleanly — pick the roomier side and clamp.
      const spaceAbove = anchorRect.top;
      const spaceBelow = window.innerHeight - anchorRect.bottom;
      top = spaceAbove >= spaceBelow
        ? Math.max(PAD, above)
        : Math.min(window.innerHeight - tipH - PAD, below);
    }
    tip.style.top = top + 'px';
  }

  function showEphemeralPanel(text, anchorRect, { loading = false } = {}) {
    const tip = _getExplainTooltip();
    tip.textContent = text;
    tip.classList.toggle('loading', loading);
    _positionTooltip(tip, anchorRect);
    tip.classList.add('visible');
    _registerEphemeralDismiss();
  }

  function _dismissEphemeralPanel() {
    const tip = document.getElementById('explain-tooltip');
    if (tip) tip.classList.remove('visible', 'loading');
    if (_ephemeralCleanup) { _ephemeralCleanup(); _ephemeralCleanup = null; }
  }

  function _registerEphemeralDismiss() {
    if (_ephemeralCleanup) _ephemeralCleanup();
    const onKey   = e => { if (e.key === 'Escape') _dismissEphemeralPanel(); };
    const onClick = e => {
      const tip = document.getElementById('explain-tooltip');
      if (tip && !tip.contains(e.target)) _dismissEphemeralPanel();
    };
    // Defer so the triggering mouseup doesn't instantly close the tooltip.
    const tid = setTimeout(() => {
      document.addEventListener('keydown', onKey);
      document.addEventListener('mousedown', onClick);
    }, 0);
    _ephemeralCleanup = () => {
      clearTimeout(tid);
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('mousedown', onClick);
    };
  }

  async function contextualQuery(selection, context, query = '') {
    const res = await fetch('/contextual_query', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ selection, context, query }),
    });
    if (!res.ok) throw new Error(`contextual_query ${res.status}`);
    return (await res.json()).result;
  }

  function _collectChatContext() {
    const MAX_CHARS = 4000;
    const rows = Array.from(document.querySelectorAll('#msg-inner .row:not(.step)'));
    const recent = rows.slice(-4);
    const parts = [];
    for (const row of recent) {
      const bubble = row.querySelector('.bubble');
      if (!bubble) continue;
      const text = bubble.innerText.trim();
      if (text) parts.push((row.classList.contains('user') ? '[User] ' : '[Agent] ') + text);
    }
    let ctx = parts.join('\n\n');
    if (ctx.length > MAX_CHARS) ctx = ctx.slice(-MAX_CHARS);
    return ctx;
  }

  // Shift+mouseup → Explain
  document.addEventListener('mouseup', async e => {
    if (!e.shiftKey) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    const selText = sel.toString().trim();
    if (!selText) return;

    const rect = sel.getRangeAt(0).getBoundingClientRect();
    showEphemeralPanel('Explaining…', rect, { loading: true });

    try {
      const result = await contextualQuery(selText, _collectChatContext());
      const tip = document.getElementById('explain-tooltip');
      if (tip && tip.classList.contains('visible')) {
        tip.textContent = result;
        tip.classList.remove('loading');
        _positionTooltip(tip, rect);
      }
    } catch {
      const tip = document.getElementById('explain-tooltip');
      if (tip && tip.classList.contains('visible')) {
        tip.textContent = 'Could not fetch explanation.';
        tip.classList.remove('loading');
        _positionTooltip(tip, rect);
      }
    }
  });

  // ── Init ──────────────────────────────────────────────────

  loadHistory();
  input.focus();
</script>
</body>
</html>
